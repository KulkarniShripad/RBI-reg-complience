<rect x="656.7" y="228" width="93.3" height="18" fill="url(#hatch135)"/>
<text x="758" y="241" font-size="11" fill="#555555">n = 18</text>
<text x="180" y="275" font-size="12" text-anchor="end" fill="#111111">G  Multi-entity</text>
<rect x="190" y="262" width="560" height="18" fill="#111111"/>
<text x="758" y="275" font-size="11" fill="#555555">n = 8</text>
<text x="470" y="320" font-size="11.5" text-anchor="middle" fill="#555555">share of test cases routed to each modality by R4</text>
