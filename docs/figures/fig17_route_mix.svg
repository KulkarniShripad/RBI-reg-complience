<rect x="637" y="58" width="39.1" height="18" fill="url(#hatch45)"/>
<rect x="678.1" y="58" width="71.9" height="18" fill="url(#hatch135)"/>
<text x="758" y="71" font-size="11" fill="#555555">n = 109</text>
