<text x="1050" y="340.5" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Bank's own group</text>
<text x="1050" y="364" font-size="11" text-anchor="middle" fill="#222222">subsidiaries, associates,</text>
<text x="1050" y="380.5" font-size="11" text-anchor="middle" fill="#222222">parents / promoters and</text>
<text x="1050" y="397" font-size="11" text-anchor="middle" fill="#222222">entities they control</text>
<text x="1050" y="413.5" font-size="11" text-anchor="middle" fill="#222222">(intra-group exposure)</text>
