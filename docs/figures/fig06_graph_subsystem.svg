<text x="250" y="340.5" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Connected-counterparty groups</text>
<text x="250" y="364" font-size="11" text-anchor="middle" fill="#222222">control: &gt; 50% voting rights (automatic),</text>
<text x="250" y="380.5" font-size="11" text-anchor="middle" fill="#222222">direct or indirect</text>
<text x="250" y="397" font-size="11" text-anchor="middle" fill="#222222">economic interdependence: one-way /</text>
<text x="250" y="413.5" font-size="11" text-anchor="middle" fill="#222222">two-way dependence, contagion</text>
