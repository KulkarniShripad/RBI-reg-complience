<text x="498.7" y="91.2" font-size="11" text-anchor="middle" fill="#222222">ownership %, control, economic</text>
<text x="498.7" y="107.7" font-size="11" text-anchor="middle" fill="#222222">dependence, director, relative,</text>
<text x="498.7" y="124.2" font-size="11" text-anchor="middle" fill="#222222">promoter (rebutted / flagged)</text>
