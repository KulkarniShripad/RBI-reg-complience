<text x="240" y="536.7" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Network rules (graphRules.js)</text>
<text x="240" y="560.2" font-size="11" text-anchor="middle" fill="#222222">53 rules: single / group limits,</text>
<text x="240" y="576.7" font-size="11" text-anchor="middle" fill="#222222">intra-group, related party, reporting</text>
<text x="240" y="593.2" font-size="11" text-anchor="middle" fill="#222222">each resolved to its RBI paragraph</text>
<rect x="470" y="494" width="770" height="120" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="855" y="529.7" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Evaluator (graphEvaluator.js)</text>
<text x="855" y="553.2" font-size="11" text-anchor="middle" fill="#222222">aggregate exposure per counterparty / group vs. limit × capital base</text>
<text x="855" y="569.7" font-size="11" text-anchor="middle" fill="#222222">headroom the rule allows (Board-approved excess, infrastructure)</text>
<text x="855" y="586.2" font-size="11" text-anchor="middle" fill="#222222">PASS · PASS_WITH_CONDITIONS · BREACH · PROHIBITED · REPORTABLE · ASSESSMENT_REQUIRED</text>
