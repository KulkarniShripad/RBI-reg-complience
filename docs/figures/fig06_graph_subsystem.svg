<text x="650" y="364" font-size="11" text-anchor="middle" fill="#222222">director, firm or company the director</text>
<text x="650" y="380.5" font-size="11" text-anchor="middle" fill="#222222">is interested in (Sec. 20, BR Act),</text>
<text x="650" y="397" font-size="11" text-anchor="middle" fill="#222222">relative, promoter, ≥ 10% shareholder,</text>
<text x="650" y="413.5" font-size="11" text-anchor="middle" fill="#222222">entities they control</text>
