<text x="390" y="271.2" font-size="11.5" text-anchor="middle" fill="#222222">SQLite FTS5 over clause-aligned chunks</text>
<text x="390" y="288.5" font-size="11.5" text-anchor="middle" fill="#222222">expanded query terms</text>
<rect x="710" y="222" width="400" height="84" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="910" y="247.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Semantic search</text>
<text x="910" y="271.2" font-size="11.5" text-anchor="middle" fill="#222222">BGE-small query embedding</text>
<text x="910" y="288.5" font-size="11.5" text-anchor="middle" fill="#222222">cosine similarity over chunk vectors</text>
<path d="M520,168 L520,195 L390,195 L390,218" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M780,168 L780,195 L910,195 L910,218" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="330" y="356" width="640" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="378.6" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Fusion and ranking</text>
<text x="650" y="402.6" font-size="11.5" text-anchor="middle" fill="#222222">reciprocal-rank fusion of both lists</text>
<text x="650" y="419.9" font-size="11.5" text-anchor="middle" fill="#222222">boosts: detected category, paragraph role · one result per clause, capped per document</text>
<text x="650" y="437.1" font-size="11.5" text-anchor="middle" fill="#222222">fallbacks: retry without category filter, then the definitions table</text>
