<text x="650" y="109.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Query analysis</text>
<text x="650" y="133.2" font-size="11.5" text-anchor="middle" fill="#222222">follow-up rewritten as a stand-alone question</text>
<text x="650" y="150.5" font-size="11.5" text-anchor="middle" fill="#222222">institution category · abbreviation expansion (corpus glossary) · intent</text>
