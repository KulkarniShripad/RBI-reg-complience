<rect width="1300" height="900" fill="#ffffff"/>
<rect x="520" y="26" width="260" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="650" y="44" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">User question (chat)</text>
