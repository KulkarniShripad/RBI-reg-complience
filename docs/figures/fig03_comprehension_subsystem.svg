<text x="155" y="394.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Knowledge base</text>
<text x="155" y="418.2" font-size="11.5" text-anchor="middle" fill="#222222">clauses · chunks</text>
<text x="155" y="435.5" font-size="11.5" text-anchor="middle" fill="#222222">FTS5 · vectors</text>
<path d="M270,404 L326,404" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="330" y="502" width="640" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="524.6" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Grounded answer</text>
<text x="650" y="548.6" font-size="11.5" text-anchor="middle" fill="#222222">LLM writes from the full text of the top clauses, citing [1], [2], …</text>
<text x="650" y="565.9" font-size="11.5" text-anchor="middle" fill="#222222">retry with wider context if the model reports insufficient sources</text>
<text x="650" y="583.1" font-size="11.5" text-anchor="middle" fill="#222222">no LLM available → extractive answer from the best sentences (labelled)</text>
<path d="M650,452 L650,498" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1030" y="502" width="230" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1145" y="541.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Gemini</text>
<text x="1145" y="565.9" font-size="11.5" text-anchor="middle" fill="#222222">optional</text>
<path d="M1030,550 L974,550" fill="none" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="330" y="648" width="640" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="674.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Answer + sources</text>
<text x="650" y="698.9" font-size="11.5" text-anchor="middle" fill="#222222">clause text, document, RBI reference, paragraph and page for every citation</text>
<path d="M650,598 L650,644" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="130" y="768" width="500" height="110" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="144" y="797.6" font-size="14" font-weight="700" fill="#111111">Source viewer</text>
<text x="144" y="821.6" font-size="11.5" fill="#222222">full provision with the cited passage highlighted</text>
<text x="144" y="838.9" font-size="11.5" fill="#222222">original PDF at the page · extracted rule atoms</text>
<text x="144" y="856.1" font-size="11.5" fill="#222222">cross-references (navigable) · neighbouring paragraphs</text>
<rect x="670" y="768" width="500" height="110" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="684" y="797.6" font-size="14" font-weight="700" fill="#111111">Plain-language restatement</text>
<text x="684" y="821.6" font-size="11.5" fill="#222222">legalese replaced, provisions split into short sentences</text>
<text x="684" y="838.9" font-size="11.5" fill="#222222">meaning guard: numbers, obligation / prohibition,</text>
<text x="684" y="856.1" font-size="11.5" fill="#222222">exceptions must survive, else the original is kept</text>
<path d="M520,718 L520,740 L380,740 L380,764" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M630,823 L666,823" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
</svg>
