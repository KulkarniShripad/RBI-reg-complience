<text x="1060" y="426" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Test · 294 cases</text>
<text x="1060" y="449.5" font-size="11" text-anchor="middle" fill="#222222">all systems, once</text>
<text x="1060" y="466" font-size="11" text-anchor="middle" fill="#222222">B1–B4 · R0–R2 · R4 · Oracle</text>
<path d="M650,340 L650,366 L1060,366 L1060,388" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M420,442 L466,442" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M830,442 L876,442" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="540" width="1180" height="84" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="566" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Measures</text>
<text x="650" y="589.4" font-size="11" text-anchor="middle" fill="#222222">accuracy (acceptable set) · end-to-end accuracy · macro-F1 · FPR / FNR · escalation · LLM calls · citation accuracy</text>
<text x="650" y="605.9" font-size="11" text-anchor="middle" fill="#222222">hallucination rate · USD and latency per case · cluster-bootstrap CI and McNemar test · ablations · Pareto frontier</text>
<path d="M1060,492 L1060,536" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="664" width="570" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="345" y="691.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Separate real-data evaluations</text>
<text x="345" y="714.7" font-size="11" text-anchor="middle" fill="#222222">11 public bank disclosures · 62-rule extraction gold set</text>
<rect x="670" y="664" width="570" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="955" y="691.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Comprehension evaluations</text>
<text x="955" y="714.7" font-size="11" text-anchor="middle" fill="#222222">115 retrieval questions vs. fixed windows · 272-clause simplification</text>
