<text x="240" y="466" font-size="11" text-anchor="middle" fill="#222222">historical accuracy (leave-one-out)</text>
<path d="M650,340 L650,366 L240,366 L240,388" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="470" y="392" width="360" height="100" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="417.7" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Validation · 259 cases</text>
<text x="650" y="441.2" font-size="11" text-anchor="middle" fill="#222222">estimator choice (log-loss)</text>
<text x="650" y="457.7" font-size="11" text-anchor="middle" fill="#222222">α, β, γ, MIN_EVIDENCE; R2 θ</text>
<text x="650" y="474.2" font-size="11" text-anchor="middle" fill="#222222">error analysis → new features</text>
<path d="M650,340 L650,366 L650,366 L650,388" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
