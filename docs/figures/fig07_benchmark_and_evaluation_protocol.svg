<path d="M650,216 L650,258" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="664" y="356" font-size="11.5" font-style="italic" fill="#555555">split by rule (hash of the rule key): no test rule is seen in training or tuning</text>
