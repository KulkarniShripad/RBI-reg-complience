<rect x="60" y="132" width="1180" height="84" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="158" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Case generator (build_benchmark.js, seed 7)</text>
<text x="650" y="181.5" font-size="11" text-anchor="middle" fill="#222222">compliant · non-compliant · boundary · near-boundary · missing data · adversarial · contradictory · ambiguous · cross-version</text>
<text x="650" y="198" font-size="11" text-anchor="middle" fill="#222222">each case: entity, rule + clause, structured fields, sources, narrative, expected and acceptable decisions, reason</text>
<path d="M430,265 a220,9 0 0,0 440,0 a220,9 0 0,0 -440,0 v66 a220,9 0 0,0 440,0 v-66" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
