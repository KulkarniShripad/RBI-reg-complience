<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Benchmark construction and evaluation protocol">
<title>Benchmark construction and evaluation protocol</title>
