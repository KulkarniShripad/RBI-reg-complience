<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" width="1300" height="1120" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="URCC-EF system architecture">
<title>URCC-EF system architecture</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
  <pattern id="hatch45" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#111111" stroke-width="2"/></pattern>
  <pattern id="hatch135" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(135)"><rect width="6" height="6" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="2"/></pattern>
</defs>
<rect width="1300" height="1120" fill="#ffffff"/>
<rect x="60" y="30" width="360" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="240" y="56.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">RBI Master Directions &amp; Circulars</text>
<text x="240" y="80.9" font-size="11.5" text-anchor="middle" fill="#222222">264 PDF directions, by institution category</text>
<rect x="470" y="30" width="360" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="56.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Bank Documents</text>
<text x="650" y="80.9" font-size="11.5" text-anchor="middle" fill="#222222">annual reports, Pillar 3 (PDF / XLSX / CSV / JSON)</text>
<rect x="880" y="30" width="360" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="1060" y="56.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Bank Data</text>
<text x="1060" y="80.9" font-size="11.5" text-anchor="middle" fill="#222222">reported figures, policy evidence, counterparty network</text>
<rect x="60" y="150" width="560" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="340" y="181.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Rule Extraction Pipeline</text>
<text x="340" y="205.2" font-size="11.5" text-anchor="middle" fill="#222222">layout-aware PDF text · structure parsing · clause classification</text>
<text x="340" y="222.5" font-size="11.5" text-anchor="middle" fill="#222222">rule atoms · definitions · cross-references · clause-aligned chunks</text>
<text x="610" y="238" font-size="10" text-anchor="end" font-style="italic" fill="#555555">Fig. 2</text>
<rect x="680" y="150" width="560" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="960" y="181.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Bank Evidence Processing</text>
<text x="960" y="205.2" font-size="11.5" text-anchor="middle" fill="#222222">document parsing · bank / category / period detection</text>
<text x="960" y="222.5" font-size="11.5" text-anchor="middle" fill="#222222">figure extraction · anomaly checks · network validation</text>
<text x="1230" y="238" font-size="10" text-anchor="end" font-style="italic" fill="#555555">Fig. 4</text>
<path d="M240,100 L240,146" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M650,100 L650,120 L960,120 L960,146" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M1060,100 L1060,146" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M260,299 a390,9 0 0,0 780,0 a390,9 0 0,0 -780,0 v78 a390,9 0 0,0 780,0 v-78" fill="#ffffff" stroke="#111111" stroke-width="1.4"/>
<text x="650" y="328.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Shared Regulatory Knowledge Base (SQLite)</text>
<text x="650" y="352.2" font-size="11.5" text-anchor="middle" fill="#222222">documents · clauses · rule atoms · definitions · cross-references · versions</text>
<text x="650" y="369.5" font-size="11.5" text-anchor="middle" fill="#222222">keyword index (FTS5) · vector index (BGE, 384-d) · bank and network tables · audit log</text>
<path d="M340,246 L340,292" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M960,246 L960,292" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="436" width="470" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="295" y="467.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Regulatory Comprehension</text>
<text x="295" y="491.2" font-size="11.5" text-anchor="middle" fill="#222222">hybrid retrieval · grounded Q&amp;A with citations</text>
<text x="295" y="508.5" font-size="11.5" text-anchor="middle" fill="#222222">source viewer · plain-language restatement</text>
<text x="520" y="524" font-size="10" text-anchor="end" font-style="italic" fill="#555555">Fig. 3</text>
<rect x="620" y="436" width="620" height="96" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="930" y="467.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">(rule, evidence) pairs</text>
<text x="930" y="491.2" font-size="11.5" text-anchor="middle" fill="#222222">applicable rules with category A–G, risk level and version in force</text>
<text x="930" y="508.5" font-size="11.5" text-anchor="middle" fill="#222222">+ normalised bank evidence and its completeness</text>
<path d="M400,386 L400,432" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M930,386 L930,432" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M1240,198 L1270,198 L1270,484 L1244,484" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160" y="580" width="980" height="110" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.4"/>
<text x="650" y="609.6" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Adaptive Reasoning-Modality Router</text>
<text x="650" y="633.6" font-size="11.5" text-anchor="middle" fill="#222222">ρ(r, E) → m ∈ {Rule Engine, Graph Evaluator, RAG + LLM, Human Review}</text>
<text x="650" y="650.9" font-size="11.5" text-anchor="middle" fill="#222222">m* = argmin  α·P(error | m, f)·risk + β·cost(m) + γ·latency(m)   subject to accuracy ≥ τ</text>
<text x="650" y="668.1" font-size="11.5" text-anchor="middle" fill="#222222">gates: no evidence → INSUFFICIENT_DATA · thin evidence → Human · complete, uncontradicted → Rule Engine</text>
<text x="1130" y="682" font-size="10" text-anchor="end" font-style="italic" fill="#555555">Fig. 5</text>
<path d="M930,532 L930,576" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="740" width="250" height="86" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="185" y="766.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Rule Engine</text>
<text x="185" y="790.2" font-size="11.5" text-anchor="middle" fill="#222222">deterministic</text>
<text x="185" y="807.5" font-size="11.5" text-anchor="middle" fill="#222222">A · C · D · B (flag)</text>
<path d="M185,690 L185,736" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M185,826 L185,872" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="370" y="740" width="250" height="86" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="495" y="766.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Graph Evaluator</text>
<text x="495" y="790.2" font-size="11.5" text-anchor="middle" fill="#222222">connected counterparties</text>
<text x="495" y="807.5" font-size="11.5" text-anchor="middle" fill="#222222">G · Fig. 6</text>
<path d="M495,690 L495,736" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M495,826 L495,872" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="680" y="740" width="250" height="86" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="805" y="766.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">RAG + LLM</text>
<text x="805" y="790.2" font-size="11.5" text-anchor="middle" fill="#222222">retrieval-grounded judgment</text>
<text x="805" y="807.5" font-size="11.5" text-anchor="middle" fill="#222222">E · F · B</text>
<path d="M805,690 L805,736" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M805,826 L805,872" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="990" y="740" width="250" height="86" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="1115" y="766.2" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Human Review</text>
<text x="1115" y="790.2" font-size="11.5" text-anchor="middle" fill="#222222">escalation</text>
<text x="1115" y="807.5" font-size="11.5" text-anchor="middle" fill="#222222">low confidence / conflict</text>
<path d="M1115,690 L1115,736" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M1115,826 L1115,872" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="876" width="1180" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="907.9" font-size="14" font-weight="700" text-anchor="middle" fill="#111111">Compliance Decision + Evidence-Grounded Audit Trail</text>
<text x="650" y="931.9" font-size="11.5" text-anchor="middle" fill="#222222">every decision cites its RBI paragraph, the evidence used, the modality and the routing reasons · recommended action for breaches</text>
<rect x="72" y="986" width="212" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="178" y="1004" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">COMPLIANT</text>
<rect x="308" y="986" width="212" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="414" y="1004" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">NON_COMPLIANT</text>
<rect x="544" y="986" width="212" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="650" y="1004" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">INSUFFICIENT_DATA</text>
<rect x="780" y="986" width="212" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="886" y="1004" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">AMBIGUOUS</text>
<rect x="1016" y="986" width="212" height="28" rx="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"/><text x="1122" y="1004" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111111">REQUIRES_HUMAN_REVIEW</text>
<path d="M650,956 L650,984" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="60" y="1044" width="1180" height="56" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.2"/>
<text x="650" y="1075.8" font-size="12.5" text-anchor="middle" fill="#222222">Interfaces:  Auto Check report  ·  Bank Explorer  ·  Regulatory chat and source viewer  ·  REST API</text>
</svg>
